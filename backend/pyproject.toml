[project]
name = "backend"
version = "0.1.0"
description = "NexBrief backend service powered by FastAPI, LangGraph, Groq, and SQLModel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "langchain-core>=0.3.40",
    "langgraph>=0.2.70",
    "langchain-groq>=0.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff",
]
